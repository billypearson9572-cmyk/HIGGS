<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" role="img" aria-label="Andrew Bird Hearing logo">
  <defs>
    <style>
      .wm   { font-family: 'Poppins','Montserrat','Segoe UI',sans-serif; }
    </style>
  </defs>

  <!-- ===== Mark: sound emanating / "being heard" ===== -->
  <g transform="translate(10,20)">
    <circle cx="60" cy="60" r="58" fill="#0E5A66"/>
    <!-- source point -->
    <circle cx="40" cy="60" r="5" fill="#F2A65A"/>
    <!-- sound waves -->
    <path d="M47 47.9 A14 14 0 0 1 47 72.1" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M53 37.5 A26 26 0 0 1 53 82.5" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M59 27.1 A38 38 0 0 1 59 92.9" fill="none" stroke="#F2A65A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <g transform="translate(150,0)">
    <text class="wm" x="0" y="78" font-size="40" font-weight="700" fill="#0E5A66" letter-spacing="0.5">Andrew Bird</text>
    <text class="wm" x="2" y="112" font-size="26" font-weight="500" fill="#2E8B9B" letter-spacing="8">HEARING</text>
    <text class="wm" x="2" y="138" font-size="13" font-weight="500" fill="#6B7B7E" letter-spacing="0.5">Independent hearing specialists · since 2007</text>
  </g>
</svg>
