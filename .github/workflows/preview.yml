name: Deploy to Vercel (Preview)
# Preview deploys for working branches: same Vercel project and token as the
# production workflow, without --prod, so every push to a claude/** branch
# gets a preview URL and production is untouched. The URL is committed to
# the `vercel-preview` output branch because this repo is often driven from
# sessions whose GitHub API access cannot list workflow runs — a git fetch
# always works.

on:
  push:
    branches:
      - "claude/**"

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  VERCEL_ORG_ID: team_R1oL0ZqG4mHuEaNX42AY4Liy
  VERCEL_PROJECT_ID: prj_SEYsnt29yOHmoAf5lEGU3fgn7YA6

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy preview to Vercel
        run: |
          url=$(npx vercel@latest deploy --yes --token "${{ secrets.VERCEL_TOKEN }}" 2>/tmp/vercel-err.txt) || {
            cat /tmp/vercel-err.txt; exit 1; }
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "Preview: $url"

      - name: Publish the URL to the vercel-preview branch
        run: |
          git config user.name "vercel-preview"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan vercel-preview-tmp
          git rm -rfq . || true
          {
            echo "branch: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "url: ${PREVIEW_URL}"
            date -u +"deployed: %Y-%m-%dT%H:%M:%SZ"
          } > PREVIEW.txt
          git add PREVIEW.txt
          git commit -q -m "preview URL for ${GITHUB_SHA}"
          git push -f origin HEAD:vercel-preview
